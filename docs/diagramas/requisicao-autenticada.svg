<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Caminho de uma requisição autenticada: o login é limitado por tentativas e devolve um JWT de 8 horas; cada chamada seguinte passa por get_current_user, que decodifica o token e consulta o usuário no banco recusando com 401 se ele estiver inativo, e depois por require_permission, que resolve as permissões dos perfis ativos e recusa com 403 quando falta a permissão do módulo.">
  <title>Caminho de uma requisição autenticada</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#AEB5B0"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E34948"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E9E5B"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="#0F1210"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">

    <!-- Faixa 1: login -->
    <text x="24" y="40" fill="#8A928B" font-size="11" letter-spacing="0.5">UMA VEZ, NO LOGIN</text>

    <rect x="24" y="56" width="150" height="58" rx="10" fill="#181D1A" stroke="#222824" stroke-width="1.5"/>
    <text x="99" y="82" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">POST /auth/login</text>
    <text x="99" y="100" text-anchor="middle" fill="#8A928B" font-size="11">e-mail + senha</text>

    <rect x="226" y="56" width="176" height="58" rx="10" fill="#181D1A" stroke="#F8D800" stroke-width="1.5"/>
    <text x="314" y="82" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Limite de tentativas</text>
    <text x="314" y="100" text-anchor="middle" fill="#8A928B" font-size="11">5 por e-mail · 20 por IP em 15 min</text>

    <rect x="454" y="56" width="164" height="58" rx="10" fill="#181D1A" stroke="#222824" stroke-width="1.5"/>
    <text x="536" y="82" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Argon2 confere</text>
    <text x="536" y="100" text-anchor="middle" fill="#8A928B" font-size="11">senha e usuário ativo</text>

    <rect x="670" y="56" width="186" height="58" rx="10" fill="#181D1A" stroke="#2E9E5B" stroke-width="1.5"/>
    <text x="763" y="82" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">JWT HS256</text>
    <text x="763" y="100" text-anchor="middle" fill="#8A928B" font-size="11">vale 8 horas · sem refresh</text>

    <line x1="174" y1="85" x2="222" y2="85" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="402" y1="85" x2="450" y2="85" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="618" y1="85" x2="666" y2="85" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#a)"/>

    <text x="226" y="140" fill="#E34948" font-size="11">estourou o limite → 429</text>
    <text x="454" y="140" fill="#E34948" font-size="11">senha errada → 401 (sempre a mesma mensagem)</text>

    <line x1="150" y1="170" x2="856" y2="170" stroke="#222824" stroke-width="1"/>

    <!-- Faixa 2: cada requisicao -->
    <text x="24" y="200" fill="#8A928B" font-size="11" letter-spacing="0.5">EM CADA REQUISIÇÃO SEGUINTE</text>

    <rect x="24" y="220" width="150" height="70" rx="10" fill="#181D1A" stroke="#222824" stroke-width="1.5"/>
    <text x="99" y="246" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">GET /pessoas/</text>
    <text x="99" y="264" text-anchor="middle" fill="#8A928B" font-size="11">Authorization:</text>
    <text x="99" y="280" text-anchor="middle" fill="#8A928B" font-size="11">Bearer &lt;token&gt;</text>

    <rect x="226" y="212" width="204" height="88" rx="10" fill="#181D1A" stroke="#F8D800" stroke-width="1.5"/>
    <text x="328" y="238" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">get_current_user</text>
    <text x="328" y="258" text-anchor="middle" fill="#8A928B" font-size="11">1. decodifica o token</text>
    <text x="328" y="276" text-anchor="middle" fill="#8A928B" font-size="11">2. busca o usuário no banco</text>
    <text x="328" y="292" text-anchor="middle" fill="#8A928B" font-size="11">3. exige ativo = true</text>

    <rect x="482" y="212" width="216" height="88" rx="10" fill="#181D1A" stroke="#F8D800" stroke-width="1.5"/>
    <text x="590" y="238" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">require_permission</text>
    <text x="590" y="258" text-anchor="middle" fill="#8A928B" font-size="11">perfis ativos → permissões</text>
    <text x="590" y="276" text-anchor="middle" fill="#8A928B" font-size="11">exige "pessoas.visualizar"</text>
    <text x="590" y="292" text-anchor="middle" fill="#8A928B" font-size="11">resolvido a cada chamada</text>

    <rect x="750" y="228" width="106" height="56" rx="10" fill="#181D1A" stroke="#2E9E5B" stroke-width="1.5"/>
    <text x="803" y="253" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">200</text>
    <text x="803" y="271" text-anchor="middle" fill="#8A928B" font-size="11">a rota executa</text>

    <line x1="174" y1="256" x2="222" y2="256" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="430" y1="256" x2="478" y2="256" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="698" y1="256" x2="746" y2="256" stroke="#2E9E5B" stroke-width="1.5" marker-end="url(#av)"/>

    <line x1="328" y1="300" x2="328" y2="348" stroke="#E34948" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="240" y="352" width="180" height="52" rx="8" fill="#181D1A" stroke="#E34948" stroke-width="1.5"/>
    <text x="330" y="374" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">401</text>
    <text x="330" y="392" text-anchor="middle" fill="#8A928B" font-size="11">sem token, expirado ou inativo</text>

    <line x1="590" y1="300" x2="590" y2="348" stroke="#E34948" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="500" y="352" width="180" height="52" rx="8" fill="#181D1A" stroke="#E34948" stroke-width="1.5"/>
    <text x="590" y="374" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">403</text>
    <text x="590" y="392" text-anchor="middle" fill="#8A928B" font-size="11">autenticado, sem a permissão</text>

    <!-- Nota -->
    <rect x="24" y="412" width="832" height="46" rx="8" fill="#181D1A" stroke="#222824" stroke-width="1"/>
    <text x="40" y="432" fill="#8A928B" font-size="11">O usuário é consultado no banco a cada requisição, e não lido do token.</text>
    <text x="40" y="449" fill="#8A928B" font-size="11">Por isso desativar alguém tem efeito imediato, mesmo com um token ainda válido.</text>

  </g>
</svg>
