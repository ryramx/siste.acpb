<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Ciclo de backup: todo dia às 6h UTC o workflow gera um dump do banco, que é criptografado e guardado por 30 dias, e espelha os arquivos do Storage sem apagar nada; aos domingos o dump do dia é copiado para a pasta semanal, retida 6 meses; no dia 1 o dump e um pacote de todos os arquivos vão para a pasta mensal, retida 24 meses.">
  <title>Ciclo de backup — o que acontece em cada dia</title>

  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#AEB5B0"/>
    </marker>
    <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F8D800"/>
    </marker>
  </defs>

  <rect width="880" height="430" fill="#0F1210"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">

    <!-- Gatilho -->
    <rect x="24" y="172" width="150" height="70" rx="10" fill="#181D1A" stroke="#F8D800" stroke-width="1.5"/>
    <text x="99" y="198" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Todo dia</text>
    <text x="99" y="217" text-anchor="middle" fill="#8A928B" font-size="11">06:00 UTC</text>
    <text x="99" y="233" text-anchor="middle" fill="#8A928B" font-size="11">(03:00 Brasília)</text>

    <!-- Duas origens -->
    <rect x="222" y="96" width="176" height="64" rx="10" fill="#181D1A" stroke="#222824" stroke-width="1.5"/>
    <text x="310" y="121" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Banco (Neon)</text>
    <text x="310" y="140" text-anchor="middle" fill="#8A928B" font-size="11">pg_dump -F c · cifrado</text>

    <rect x="222" y="252" width="176" height="64" rx="10" fill="#181D1A" stroke="#222824" stroke-width="1.5"/>
    <text x="310" y="277" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Arquivos (Storage)</text>
    <text x="310" y="296" text-anchor="middle" fill="#8A928B" font-size="11">comprovantes e fotos</text>

    <line x1="174" y1="196" x2="218" y2="140" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#s)"/>
    <line x1="174" y1="220" x2="218" y2="276" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#s)"/>

    <!-- Destinos -->
    <rect x="466" y="60" width="200" height="66" rx="10" fill="#181D1A" stroke="#2E9E5B" stroke-width="1.5"/>
    <text x="566" y="85" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">backups/diario/</text>
    <text x="566" y="104" text-anchor="middle" fill="#8A928B" font-size="11">retém 30 dias</text>

    <rect x="466" y="150" width="200" height="66" rx="10" fill="#181D1A" stroke="#2E9E5B" stroke-width="1.5"/>
    <text x="566" y="175" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">backups/semanal/</text>
    <text x="566" y="194" text-anchor="middle" fill="#8A928B" font-size="11">retém 6 meses</text>

    <rect x="466" y="240" width="200" height="80" rx="10" fill="#181D1A" stroke="#2E9E5B" stroke-width="1.5"/>
    <text x="566" y="265" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">backups/mensal/</text>
    <text x="566" y="284" text-anchor="middle" fill="#8A928B" font-size="11">dump + pacote de arquivos</text>
    <text x="566" y="302" text-anchor="middle" fill="#8A928B" font-size="11">retém 24 meses</text>

    <rect x="466" y="344" width="200" height="66" rx="10" fill="#181D1A" stroke="#222824" stroke-width="1.5"/>
    <text x="566" y="369" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">backups/arquivos/espelho/</text>
    <text x="566" y="388" text-anchor="middle" fill="#8A928B" font-size="11">não expira</text>

    <!-- Ligacoes -->
    <line x1="398" y1="122" x2="462" y2="95" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#s)"/>
    <text x="392" y="70" fill="#AEB5B0" font-size="11">todo dia</text>

    <path d="M 666 95 C 720 95 720 160 672 178" fill="none" stroke="#F8D800" stroke-width="1.5" marker-end="url(#sa)"/>
    <text x="690" y="140" fill="#F8D800" font-size="11">domingo: copia</text>

    <path d="M 666 110 C 780 110 780 250 672 268" fill="none" stroke="#F8D800" stroke-width="1.5" marker-end="url(#sa)"/>
    <text x="700" y="232" fill="#F8D800" font-size="11">dia 1: copia</text>

    <line x1="398" y1="290" x2="462" y2="292" stroke="#F8D800" stroke-width="1.5" marker-end="url(#sa)"/>
    <text x="378" y="242" fill="#F8D800" font-size="11">dia 1: tar + cifra</text>

    <line x1="398" y1="306" x2="462" y2="368" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#s)"/>
    <text x="356" y="348" fill="#AEB5B0" font-size="11">todo dia: sync</text>
    <text x="356" y="364" fill="#AEB5B0" font-size="11">sem --delete</text>

    <!-- Nota -->
    <rect x="24" y="300" width="176" height="96" rx="8" fill="#181D1A" stroke="#222824" stroke-width="1"/>
    <text x="38" y="322" fill="#8A928B" font-size="11">Sem --delete de propósito:</text>
    <text x="38" y="340" fill="#8A928B" font-size="11">comprovante apagado por</text>
    <text x="38" y="358" fill="#8A928B" font-size="11">engano continua no espelho.</text>
    <text x="38" y="380" fill="#8A928B" font-size="11">O mensal é o de longo prazo.</text>

  </g>
</svg>
