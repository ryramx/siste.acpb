<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" width="860" height="530" role="img" aria-label="Arquitetura de produção do Sistema ACPB: o navegador fala com o site estático e com a API no Render; a API fala com o banco no Neon, com o armazenamento de arquivos no Supabase e com a Brevo para enviar e-mail; o GitHub Actions faz o backup diário do banco do Neon para o Supabase.">
  <title>Arquitetura de produção — Sistema ACPB</title>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#AEB5B0"/>
    </marker>
    <marker id="seta-amarela" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F8D800"/>
    </marker>
  </defs>

  <!-- Fundo proprio: o arquivo e renderizado isolado pelo GitHub, em tema claro ou escuro,
       e sem fundo o traco claro sumiria no tema claro. -->
  <rect width="860" height="530" fill="#0F1210"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">

    <!-- Quem usa -->
    <rect x="24" y="180" width="130" height="64" rx="10" fill="#181D1A" stroke="#2E9E5B" stroke-width="1.5"/>
    <text x="89" y="205" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Navegador</text>
    <text x="89" y="224" text-anchor="middle" fill="#8A928B" font-size="11">celular ou desktop</text>

    <!-- Render -->
    <rect x="212" y="96" width="232" height="232" rx="12" fill="none" stroke="#222824" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="328" y="118" text-anchor="middle" fill="#8A928B" font-size="11" letter-spacing="0.5">RENDER · plano free · Ohio</text>

    <rect x="232" y="132" width="192" height="64" rx="10" fill="#181D1A" stroke="#222824" stroke-width="1.5"/>
    <text x="328" y="157" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Site estático</text>
    <text x="328" y="176" text-anchor="middle" fill="#8A928B" font-size="11">React + Vite (dist/)</text>

    <rect x="232" y="228" width="192" height="76" rx="10" fill="#181D1A" stroke="#F8D800" stroke-width="1.5"/>
    <text x="328" y="253" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">API FastAPI</text>
    <text x="328" y="271" text-anchor="middle" fill="#8A928B" font-size="11">uvicorn, 1 processo</text>
    <text x="328" y="289" text-anchor="middle" fill="#8A928B" font-size="11">hiberna após ~15 min</text>

    <!-- Servicos externos -->
    <rect x="536" y="60" width="180" height="66" rx="10" fill="#181D1A" stroke="#222824" stroke-width="1.5"/>
    <text x="626" y="85" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Neon</text>
    <text x="626" y="104" text-anchor="middle" fill="#8A928B" font-size="11">PostgreSQL 18</text>

    <rect x="536" y="176" width="180" height="84" rx="10" fill="#181D1A" stroke="#222824" stroke-width="1.5"/>
    <text x="626" y="201" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Supabase Storage</text>
    <text x="626" y="220" text-anchor="middle" fill="#8A928B" font-size="11">anexos_financeiros/</text>
    <text x="626" y="238" text-anchor="middle" fill="#8A928B" font-size="11">fotos_pessoas/</text>

    <rect x="536" y="300" width="180" height="66" rx="10" fill="#181D1A" stroke="#222824" stroke-width="1.5"/>
    <text x="626" y="325" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Brevo</text>
    <text x="626" y="344" text-anchor="middle" fill="#8A928B" font-size="11">e-mail por HTTPS</text>

    <!-- Backup -->
    <rect x="232" y="384" width="192" height="62" rx="10" fill="#181D1A" stroke="#222824" stroke-width="1.5"/>
    <text x="328" y="408" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">GitHub Actions</text>
    <text x="328" y="426" text-anchor="middle" fill="#8A928B" font-size="11">backup 06:00 UTC</text>

    <!-- Ligacoes do navegador -->
    <line x1="154" y1="196" x2="228" y2="164" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="154" y="152" fill="#AEB5B0" font-size="11">HTML/JS</text>

    <line x1="154" y1="228" x2="228" y2="258" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="146" y="270" fill="#AEB5B0" font-size="11">JSON + Bearer</text>

    <!-- API para os servicos -->
    <line x1="424" y1="252" x2="532" y2="112" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="440" y="176" fill="#AEB5B0" font-size="11">SQL · sslmode=require</text>

    <line x1="424" y1="266" x2="532" y2="218" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="440" y="240" fill="#AEB5B0" font-size="11">S3 · comprovantes</text>

    <line x1="424" y1="290" x2="532" y2="326" stroke="#AEB5B0" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="436" y="322" fill="#AEB5B0" font-size="11">recuperação de senha</text>

    <!-- Backup em amarelo: e o unico caminho que nao passa pela aplicacao.
         Tracejado quando le, continuo quando escreve. -->
    <path d="M 424 398 C 490 398 490 132 532 120" fill="none" stroke="#F8D800" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta-amarela)"/>
    <text x="436" y="372" fill="#F8D800" font-size="11">lê: pg_dump</text>

    <path d="M 424 428 L 786 428 L 786 222 L 724 222" fill="none" stroke="#F8D800" stroke-width="1.5" marker-end="url(#seta-amarela)"/>
    <text x="440" y="448" fill="#F8D800" font-size="11">escreve: dump cifrado + espelho dos arquivos</text>

    <!-- Nota, como rodape de largura inteira para nao disputar espaco com o caminho acima. -->
    <rect x="24" y="470" width="812" height="46" rx="8" fill="#181D1A" stroke="#222824" stroke-width="1"/>
    <text x="40" y="490" fill="#8A928B" font-size="11">O backup é escrito no MESMO projeto Supabase que guarda os arquivos de produção.</text>
    <text x="40" y="507" fill="#8A928B" font-size="11">Protege contra perder o banco, não contra perder o Supabase — ver “Pendente” em BACKUP_E_RESTAURACAO.md.</text>

  </g>
</svg>
