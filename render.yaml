# Blueprint do Render (plano gratuito): dois servicos, a API em Python e o site estatico
# do frontend.
#
# O banco NAO fica aqui - o Postgres gratuito do Render expira, entao usamos o Neon. Os
# arquivos tambem nao - o disco daqui e efemero, entao vao para o Supabase Storage.
# Ver DEPLOY.md.
#
# Variaveis marcadas com `sync: false` nao sao versionadas: o Render pede o valor na
# criacao do servico. Segredo nenhum entra neste arquivo.

services:
  - type: web
    name: acpb-api
    runtime: python
    plan: free
    # Mesma regiao do Neon e do Supabase (us-east-2). Cada tela do sistema dispara varias
    # consultas ao banco: se a API ficar em outra regiao, cada uma delas atravessa o
    # continente. O padrao do Render e Oregon, entao isto precisa ser explicito.
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # As migrations rodam antes de subir a aplicacao, nunca depois (ver DEPLOY.md).
    # `alembic upgrade head` e idempotente: num banco ja atualizado e um no-op rapido,
    # o que importa porque o plano gratuito hiberna e reexecuta isso a cada retorno.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness: nao depende do banco, entao um Postgres fora do ar nao derruba o servico.
    healthCheckPath: /health/
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      # Neon: connection string completa, com sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      # Origem do site (o outro servico deste blueprint). Sem '*' - a aplicacao recusa subir.
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Armazenamento de arquivos: o disco do plano gratuito e efemero, entao anexos e
      # fotos vao para object storage S3-compativel (Supabase Storage).
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Precisa ser a regiao real do projeto no Supabase (o R2 ignoraria).
      - key: S3_REGION
        sync: false
      # SMTP do Gmail para o e-mail de recuperacao de senha. Enviar pelo servidor do
      # proprio provedor do remetente mantem SPF/DKIM alinhados - um relay de terceiro
      # enviando em nome de um @gmail.com nao consegue assinar como tal, e cairia em spam.
      # SMTP_PASSWORD e uma "App Password" do Google, nao a senha da conta.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: acpb-sistema
    runtime: static
    plan: free
    # O frontend fica na raiz do repositorio (o backend e que esta em backend/).
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA: o roteamento e do react-router, no navegador. Sem este rewrite, abrir ou
    # recarregar /membros direto pediria ao servidor um arquivo que nao existe e daria 404 -
    # so a raiz funcionaria.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL publica da API (o outro servico deste blueprint). O build falha de proposito
      # se faltar, em vez de gerar um bundle apontando para 127.0.0.1.
      - key: VITE_API_URL
        sync: false
