# Blueprint do Render (plano gratuito): dois servicos, a API em Python e o site estatico
# do frontend.
#
# O banco NAO fica aqui - o Postgres gratuito do Render expira, entao usamos o Neon. Os
# arquivos tambem nao - o disco daqui e efemero, entao vao para o Supabase Storage.
# Ver DEPLOY.md.
#
# Variaveis marcadas com `sync: false` nao sao versionadas: o Render pede o valor na
# criacao do servico. Segredo nenhum entra neste arquivo.

services:
  - type: web
    name: acpb-api
    runtime: python
    plan: free
    # Mesma regiao do Neon e do Supabase (us-east-2). Cada tela do sistema dispara varias
    # consultas ao banco: se a API ficar em outra regiao, cada uma delas atravessa o
    # continente. O padrao do Render e Oregon, entao isto precisa ser explicito.
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # As migrations rodam antes de subir a aplicacao, nunca depois (ver DEPLOY.md).
    # `alembic upgrade head` e idempotente: num banco ja atualizado e um no-op rapido,
    # o que importa porque o plano gratuito hiberna e reexecuta isso a cada retorno.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness: nao depende do banco, entao um Postgres fora do ar nao derruba o servico.
    healthCheckPath: /health/
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      # Neon: connection string completa, com sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      # Origem do site (o outro servico deste blueprint). Sem '*' - a aplicacao recusa subir.
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Armazenamento de arquivos: o disco do plano gratuito e efemero, entao anexos e
      # fotos vao para object storage S3-compativel (Supabase Storage).
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Precisa ser a regiao real do projeto no Supabase (o R2 ignoraria).
      - key: S3_REGION
        sync: false
      # E-mail de recuperacao de senha, enviado pela API HTTPS da Brevo.
      #
      # Nao e SMTP de proposito: o Render bloqueia as portas 25, 465 e 587 nos servicos do
      # plano gratuito desde setembro de 2025, para conter spam. Com SMTP (Gmail ou qualquer
      # outro) o envio falha por timeout por mais correta que esteja a configuracao, e o
      # sistema dizia "instrucoes enviadas" sem enviar nada. Uma API sobre HTTPS atravessa o
      # bloqueio. Passar a API para um plano pago tambem resolveria, ao custo da mensalidade.
      #
      # BREVO_API_KEY: chave gerada em Brevo > SMTP & API > API Keys.
      # EMAIL_FROM: remetente verificado na Brevo (um endereco comum serve; a verificacao e
      # por codigo enviado a ele, sem exigir dominio proprio).
      #
      # EMAIL_BACKEND fica como `sync: false` de proposito, em vez de `value: brevo`. O
      # blueprint sobrescreve valores literais no proximo sync: fixar `brevo` aqui antes de
      # BREVO_API_KEY existir no painel derrubaria a API no boot, porque a validacao de
      # producao recusa um backend de e-mail incompleto. A ordem segura e: criar a conta,
      # preencher BREVO_API_KEY e EMAIL_FROM no painel e so entao trocar EMAIL_BACKEND para
      # `brevo`. Ate la o valor continua `smtp`, e o SMTP abaixo segue como esta.
      - key: EMAIL_BACKEND
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NOME
        value: Sistema ACPB
      # SMTP mantido para nao ser removido do servico em um sync do blueprint, e porque
      # volta a ser utilizavel se a API sair do plano gratuito.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: acpb-sistema
    runtime: static
    # O frontend fica na raiz do repositorio (o backend e que esta em backend/).
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA: o roteamento e do react-router, no navegador. Sem este rewrite, abrir ou
    # recarregar /membros direto pediria ao servidor um arquivo que nao existe e daria 404 -
    # so a raiz funcionaria.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL publica da API (o outro servico deste blueprint). O build falha de proposito
      # se faltar, em vez de gerar um bundle apontando para 127.0.0.1.
      - key: VITE_API_URL
        sync: false
