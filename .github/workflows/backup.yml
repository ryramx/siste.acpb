# Backup diario do banco de producao.
#
# BACKUP_E_RESTAURACAO.md definia a politica e deixava a automacao de fora, como "trabalho de
# infraestrutura". O resultado pratico era um procedimento escrito e nenhum backup acontecendo,
# com dados reais de pessoas (inclusive CPF) em producao. Este workflow fecha isso.
#
# O documento original pressupunha servidor proprio: copia local em /var/backups e anexos em
# backend/storage/. A producao real e outra -- Render (disco efemero), banco no Neon e anexos no
# Supabase Storage. Entao nao ha copia local que sobreviva, e o backup nasce ja fora do provedor
# do banco, que e o que a regra 3-2-1 pede. ATENCAO: este workflow cobre o BANCO. Os anexos no
# Supabase ainda nao tem backup proprio -- ver a secao "Pendente" em BACKUP_E_RESTAURACAO.md.
#
# Segredos necessarios no repositorio (Settings > Secrets and variables > Actions):
#   BACKUP_DATABASE_URL     connection string do Neon (a mesma DATABASE_URL do Render)
#   BACKUP_PASSPHRASE       senha de criptografia do arquivo; guardada no cofre da associacao,
#                           NUNCA junto do backup -- sem ela o arquivo e irrecuperavel
#   BACKUP_S3_ENDPOINT      endpoint S3 do Supabase Storage
#   BACKUP_S3_BUCKET        bucket de destino
#   BACKUP_S3_ACCESS_KEY_ID / BACKUP_S3_SECRET_ACCESS_KEY / BACKUP_S3_REGION
#
# Enquanto os segredos nao existirem, o job falha todo dia, de proposito: um backup que nao roda
# e silencioso e pior do que nenhum, porque da a impressao de que existe.

name: Backup do banco

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasilia, fora do horario de uso.
    - cron: "0 6 * * *"
  # Permite rodar sob demanda pela aba Actions -- e assim que se testa a configuracao sem
  # esperar a madrugada, e tambem como tirar um backup antes de uma migration arriscada.
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Conferir segredos
        # Falhar aqui, nomeando o que falta, em vez de falhar adiante com erro de conexao.
        run: |
          faltando=""
          for s in BACKUP_DATABASE_URL BACKUP_PASSPHRASE BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET \
                   BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY; do
            eval "valor=\${$s}"
            [ -z "$valor" ] && faltando="$faltando $s"
          done
          if [ -n "$faltando" ]; then
            echo "Segredos nao configurados:$faltando"
            echo "Ver o cabecalho de .github/workflows/backup.yml."
            exit 1
          fi
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}

      - name: Gerar o dump
        # pg_dump roda dentro da imagem oficial do Postgres em vez do cliente do runner: o
        # cliente do ubuntu costuma estar em versao anterior a do servidor, e pg_dump se recusa
        # a dumpar um servidor mais novo que ele. Um cliente mais novo que o servidor funciona.
        # -F c = formato custom, comprimido, restauravel com pg_restore seletivamente.
        run: |
          set -o pipefail
          docker run --rm -i \
            -e PGCONNECT_TIMEOUT=30 \
            postgres:17 \
            pg_dump --format=custom --no-owner --no-privileges "$BACKUP_DATABASE_URL" \
            > acpb.dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}

      - name: Conferir que o dump nao veio vazio
        # Heuristica pedida pela politica: um pg_dump pode sair com codigo 0 e ainda assim
        # produzir arquivo vazio ou truncado. 50 KB e folgadamente menor que o banco real e
        # folgadamente maior que um arquivo "so cabecalho".
        run: |
          tamanho=$(stat -c%s acpb.dump)
          echo "Tamanho do dump: $tamanho bytes"
          if [ "$tamanho" -lt 51200 ]; then
            echo "Dump suspeito de estar vazio ou truncado (< 50 KB)."
            exit 1
          fi

      - name: Criptografar
        # O arquivo sai criptografado antes de deixar o runner. A senha fica no cofre da
        # associacao, separada do destino: quem tiver acesso ao bucket nao le os dados.
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "acpb-$(date -u +%Y-%m-%d).dump.gpg" acpb.dump
          rm acpb.dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      - name: Enviar para o armazenamento externo
        run: |
          aws s3 cp "acpb-$(date -u +%Y-%m-%d).dump.gpg" \
            "s3://$BACKUP_S3_BUCKET/backups/diario/" \
            --endpoint-url "$BACKUP_S3_ENDPOINT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}

      - name: Aplicar retencao de 30 dias nos diarios
        # A politica preve ainda semanais (6 meses) e mensais (24 meses). Aqui so o diario esta
        # automatizado; os demais dependem de decidir onde guardar copia de longo prazo.
        run: |
          limite=$(date -u -d '30 days ago' +%Y-%m-%d)
          aws s3 ls "s3://$BACKUP_S3_BUCKET/backups/diario/" \
            --endpoint-url "$BACKUP_S3_ENDPOINT" \
            | awk '{print $4}' | grep -E '^acpb-[0-9]{4}-[0-9]{2}-[0-9]{2}\.dump\.gpg$' \
            | while read -r arquivo; do
                data=$(echo "$arquivo" | sed -E 's/^acpb-(.*)\.dump\.gpg$/\1/')
                if [ "$data" \< "$limite" ]; then
                  echo "Removendo backup vencido: $arquivo"
                  aws s3 rm "s3://$BACKUP_S3_BUCKET/backups/diario/$arquivo" \
                    --endpoint-url "$BACKUP_S3_ENDPOINT"
                fi
              done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
